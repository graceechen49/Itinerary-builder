<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bodhi Research Group Itinerary Builder</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    .form-container, .itinerary-preview { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { background-color: #0f2b46; color: white; padding: 10px 15px; border: none; border-radius: 4px; margin-top: 15px; cursor: pointer; }
    
    .day-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
    .event-row { display: grid; grid-template-columns: 100px 1fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
    @media (max-width: 600px) { .event-row { grid-template-columns: 1fr; } }
    .small-btn { background: #2c7a7b; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .delete-btn { background: #e53e3e; }
    .day-header { color: #0f2b46; border-bottom: 2px solid #cbd5e0; padding-bottom: 5px; margin-top: 25px; }
    .event-item { margin-bottom: 10px; padding-left: 10px; border-left: 3px solid #0f2b46; }

    /* Output header centering styles */
    .output-header { text-align: center; margin-bottom: 20px; }
    .output-logo { height: 60px; display: block; margin: 0 auto 10px auto; }
    .output-header h1 { color: #0f2b46; margin: 5px 0 15px 0; }
    
    .draft-badge { display: inline-block; margin-left: 15px; font-size: 12px; color: #2c7a7b; font-weight: normal; }

    @media print {
      body { margin: 0; padding: 10px; }
      .form-container, button { display: none; }
      .itinerary-preview { border: none; padding: 0; }
    }
  </style>
</head>
<body>

  <div class="form-container" id="mainForm">
    <h2>Enter Itinerary Details <span class="draft-badge" id="saveStatus">Auto-saving...</span></h2>

    <label>Traveler Name:</label>
    <input type="text" id="clientName" placeholder="Ranjan Bhaduri">

    <label>Trip Start Date:</label>
    <input type="date" id="startDate">

    <label>Trip End Date:</label>
    <input type="date" id="endDate">

    <h3>Daily Schedule & Events</h3>
    <div id="daysBuilder"></div>

    <button type="button" onclick="generateItinerary()">Generate & Print</button>
    <button type="button" onclick="clearDraft()" style="background-color: #e2e8f0; color: #4a5568; margin-left: 10px;">Clear Form</button>
  </div>

  <div class="itinerary-preview" id="output" style="display:none;">
    
    <div class="output-header">
      <img class="output-logo" src="logo.png?v=2" alt="Bodhi Logo">
      <h1>Bodhi Research Group Travel Itinerary</h1>
    </div>

    <p><strong>Prepared For:</strong> <span id="outName"></span></p>
    <p><strong>Dates:</strong> <span id="outDates"></span></p>
    <p><a href="https://graceechen49.github.io/Itinerary-builder/" target="_blank" style="color: #2c7a7b; font-weight: bold;">Edit</a></p>
    <hr>
    
    <div id="outSchedule"></div>
  </div>

  <script>
    // Listeners to trigger day updates and auto-saving
    document.getElementById('startDate').addEventListener('change', () => { updateDays(); saveDraft(); });
    document.getElementById('endDate').addEventListener('change', () => { updateDays(); saveDraft(); });
    document.getElementById('mainForm').addEventListener('input', saveDraft);

    // Run on page load
    window.onload = loadDraft;

    function updateDays() {
      const startVal = document.getElementById('startDate').value;
      const endVal = document.getElementById('endDate').value;
      const container = document.getElementById('daysBuilder');
      container.innerHTML = '';

      if (!startVal || !endVal) return;

      const [sYear, sMonth, sDay] = startVal.split('-');
      const [eYear, eMonth, eDay] = endVal.split('-');
      let curr = new Date(sYear, sMonth - 1, sDay);
      const end = new Date(eYear, eMonth - 1, eDay);

      if (curr > end) return;

      let dayCount = 1;
      while (curr <= end) {
        const dateStr = curr.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        
        const dayDiv = document.createElement('div');
        dayDiv.className = 'day-box';
        dayDiv.innerHTML = `
          <h4>Day ${dayCount} (${dateStr})</h4>
          <div class="events-list" id="events-day-${dayCount}"></div>
          <button type="button" class="small-btn" onclick="addEventRow(${dayCount},'','',''); saveDraft();">+ Add Time Block</button>
        `;
        container.appendChild(dayDiv);

        addEventRow(dayCount, '', '', '');
        curr.setDate(curr.getDate() + 1);
        dayCount++;
      }
    }

    function addEventRow(dayNum, timeVal, locVal, noteVal) {
      const list = document.getElementById(`events-day-${dayNum}`);
      const row = document.createElement('div');
      row.className = 'event-row';
      row.innerHTML = `
        <input type="text" placeholder="Time (e.g. 9:00 AM)" class="ev-time" value="${timeVal}">
        <input type="text" placeholder="Location Name" class="ev-loc" value="${locVal}">
        <input type="text" placeholder="Notes / Activity" class="ev-note" value="${noteVal}">
        <button type="button" class="small-btn delete-btn" onclick="this.parentElement.remove(); saveDraft();">X</button>
      `;
      list.appendChild(row);
    }

    // --- AUTO SAVE LOGIC ---
    function saveDraft() {
      const draft = {
        name: document.getElementById('clientName').value,
        start: document.getElementById('startDate').value,
        end: document.getElementById('endDate').value,
        days: []
      };

      const dayBoxes = document.querySelectorAll('.day-box');
      dayBoxes.forEach(box => {
        const dayEvents = [];
        box.querySelectorAll('.event-row').forEach(row => {
          dayEvents.push({
            time: row.querySelector('.ev-time').value,
            loc: row.querySelector('.ev-loc').value,
            note: row.querySelector('.ev-note').value
          });
        });
        draft.days.push(dayEvents);
      });

      localStorage.setItem('bodhiItineraryDraft', JSON.stringify(draft));
      
      const status = document.getElementById('saveStatus');
      status.innerText = "Saved just now";
      setTimeout(() => status.innerText = "", 2000);
    }

    function loadDraft() {
      const saved = localStorage.getItem('bodhiItineraryDraft');
      if (!saved) return;

      const draft = JSON.parse(saved);
      document.getElementById('clientName').value = draft.name || '';
      
      if (draft.start && draft.end) {
        document.getElementById('startDate').value = draft.start;
        document.getElementById('endDate').value = draft.end;
        updateDays();

        // Restore the typed events
        const dayBoxes = document.querySelectorAll('.day-box');
        dayBoxes.forEach((box, index) => {
          if (draft.days[index]) {
            const list = box.querySelector('.events-list');
            list.innerHTML = ''; // Clear default blank row
            draft.days[index].forEach(ev => {
              addEventRow(index + 1, ev.time, ev.loc, ev.note);
            });
            // If they deleted all rows on a day, give them one back
            if (draft.days[index].length === 0) addEventRow(index + 1, '', '', '');
          }
        });
      }
    }

    function clearDraft() {
      if(confirm("Are you sure you want to clear the entire form?")) {
        localStorage.removeItem('bodhiItineraryDraft');
        location.reload();
      }
    }

    // --- PRINT LOGIC ---
    function generateItinerary() {
      document.getElementById('outName').innerText = document.getElementById('clientName').value;
      const startVal = document.getElementById('startDate').value;
      const endVal = document.getElementById('endDate').value;
      document.getElementById('outDates').innerText = startVal && endVal ? `${startVal} to ${endVal}` : '';

      const scheduleContainer = document.getElementById('outSchedule');
      scheduleContainer.innerHTML = '<h3>Schedule</h3>';

      const dayBoxes = document.querySelectorAll('.day-box');
      dayBoxes.forEach((box) => {
        const dayTitle = box.querySelector('h4').innerText;
        const rows = box.querySelectorAll('.event-row');

        let dayHTML = `<h4 class="day-header">${dayTitle}</h4>`;
        let hasContent = false;
        
        rows.forEach(r => {
          const time = r.querySelector('.ev-time').value;
          const loc = r.querySelector('.ev-loc').value;
          const note = r.querySelector('.ev-note').value;

          if (time || loc || note) {
            hasContent = true;
            const mapsUrl = loc ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc)}` : '';
            const locDisplay = loc ? ` - <a href="${mapsUrl}" target="_blank">${loc}</a>` : '';

            dayHTML += `
              <div class="event-item">
                <strong>${time || 'All Day'}:</strong> ${note}${locDisplay}
              </div>`;
          }
        });
        if (hasContent) scheduleContainer.innerHTML += dayHTML;
      });

      document.getElementById('output').style.display = 'block';

      // Temporarily change the page title to set the PDF file name
      const originalTitle = document.title;
      if (startVal && endVal) {
        document.title = `Itinerary (${startVal} to ${endVal})`;
      } else {
        document.title = 'Itinerary';
      }

      // Trigger the print/save window
      window.print();

      // Change the tab title back to normal
      document.title = originalTitle;
    }
  </script>

</body>
</html>
