<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Company Itinerary Builder</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    .form-container, .itinerary-preview { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { background-color: #0056b3; color: white; padding: 10px 15px; border: none; border-radius: 4px; margin-top: 15px; cursor: pointer; }
    @media print {
      .form-container, button { display: none; }
      .itinerary-preview { border: none; }
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Enter Itinerary Details</h2>
    <label>Client / Traveler Name:</label>
    <input type="text" id="clientName" placeholder="John Doe">

    <label>Trip Dates:</label>
    <input type="text" id="tripDates" placeholder="Oct 12 - Oct 15, 2026">

    <label>Schedule & Notes:</label>
    <textarea id="details" rows="5" placeholder="Day 1: Arrival at 10 AM..."></textarea>

    <button onclick="generateItinerary()">Generate & Print</button>
  </div>

  <div class="itinerary-preview" id="output" style="display:none;">
    <h1 style="color: #0056b3;">Company Travel Itinerary</h1>
    <p><strong>Prepared For:</strong> <span id="outName"></span></p>
    <p><strong>Dates:</strong> <span id="outDates"></span></p>
    <hr>
    <h3>Schedule</h3>
    <p id="outDetails" style="white-space: pre-wrap;"></p>
  </div>

  <script>
    function generateItinerary() {
      document.getElementById('outName').innerText = document.getElementById('clientName').value;
      document.getElementById('outDates').innerText = document.getElementById('tripDates').value;
      document.getElementById('outDetails').innerText = document.getElementById('details').value;
      
      document.getElementById('output').style.display = 'block';
      window.print();
    }
  </script>

</body>
</html>
